name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run compile-tests

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package

  publish-code-marketplace:
    name: 'Publish (Code Marketplace)'
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: marketplace-publish-queue
      cancel-in-progress: false
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Package extension
        id: package
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Publishing STABLE release for ${{ github.ref }}"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            npx @vscode/vsce package --no-git-tag-version -o extension.vsix
          else
            echo "Publishing PRE-RELEASE for main branch"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            npm version "${MAJOR_MINOR}.$(date -u +'%y%j%H%M')" --no-git-tag-version
            npx @vscode/vsce package --pre-release --no-git-tag-version -o extension.vsix
          fi

      - name: Publish to Code Marketplace
        run: |
          EXTRA_FLAGS=""
          if [ "${{ steps.package.outputs.is_prerelease }}" = "true" ]; then
            EXTRA_FLAGS="--pre-release"
          fi
          MAX_RETRIES=3
          DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to publish to Code Marketplace..."
            if output=$(npx @vscode/vsce publish --packagePath extension.vsix $EXTRA_FLAGS --skip-duplicate --pat "${{ secrets.MARKETPLACE_TOKEN }}" 2>&1); then
              echo "$output"
              exit 0
            else
              echo "$output"
              if echo "$output" | grep -qiE "RequestBlockedException|Concurrency|Rate limits|429"; then
                echo "::warning::Marketplace concurrency rate limit hit. Waiting ${DELAY}s before retrying (attempt $i/$MAX_RETRIES)..."
                sleep $DELAY
                DELAY=$((DELAY * 2))
              elif echo "$output" | grep -qi "already published"; then
                echo "::notice::Version already published on Code Marketplace, skipping."
                exit 0
              else
                echo "::error::Publish failed with non-retryable error."
                exit 1
              fi
            fi
          done
          echo "::error::Exceeded maximum retry attempts ($MAX_RETRIES) due to Marketplace concurrency limit."
          exit 1
        timeout-minutes: 5

  publish-openvsx:
    name: 'Publish (OpenVSX)'
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: openvsx-publish-queue
      cancel-in-progress: false
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Package extension
        id: package
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Publishing STABLE release for ${{ github.ref }}"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            npx @vscode/vsce package --no-git-tag-version -o extension.vsix
          else
            echo "Publishing PRE-RELEASE for main branch"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            npm version "${MAJOR_MINOR}.$(date -u +'%y%j%H%M')" --no-git-tag-version
            npx @vscode/vsce package --pre-release --no-git-tag-version -o extension.vsix
          fi

      - name: Publish to OpenVSX
        run: |
          EXTRA_FLAGS=""
          if [ "${{ steps.package.outputs.is_prerelease }}" = "true" ]; then
            EXTRA_FLAGS="--pre-release"
          fi
          if output=$(npx ovsx publish extension.vsix $EXTRA_FLAGS --pat ${{ secrets.OPENVSX_TOKEN }} 2>&1); then
            echo "$output"
          elif echo "$output" | grep -qi "already published"; then
            echo "$output"
            echo "::notice::Version is already published on OpenVSX, skipping."
          else
            echo "$output"
            exit 1
          fi
        timeout-minutes: 3
