name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run compile-tests

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: npx vsce package
        run: npx @vscode/vsce package

  prerelease-code-marketplace:
    name: 'Pre-release (Code Marketplace)'
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Set pre-release version
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "${MAJOR_MINOR}.$(date -u +'%y%j%H%M')" --no-git-tag-version

      - name: Publish Extension (Code Marketplace, pre-release)
        run: npx vsce publish --pre-release --skip-duplicate --pat ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          MAX_RETRIES=5
          DELAY=20
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to publish to Code Marketplace..."
            if output=$(npx @vscode/vsce publish --pre-release --skip-duplicate --pat "${{ secrets.MARKETPLACE_TOKEN }}" 2>&1); then
              echo "$output"
              exit 0
            else
              echo "$output"
              if echo "$output" | grep -qiE "RequestBlockedException|Concurrency|Rate limits|429"; then
                echo "::warning::Marketplace concurrency rate limit hit. Waiting ${DELAY}s before retrying (attempt $i/$MAX_RETRIES)..."
                sleep $DELAY
                DELAY=$((DELAY * 2))
              elif echo "$output" | grep -qi "already published"; then
                echo "::notice::Version already published on Code Marketplace, skipping."
                exit 0
              else
                echo "::error::Publish failed with non-retryable error."
                exit 1
              fi
            fi
          done
          echo "::error::Exceeded maximum retry attempts ($MAX_RETRIES) due to Marketplace concurrency limit."
          exit 1
        timeout-minutes: 5

  prerelease-openvsx:
    name: 'Pre-release (OpenVSX)'
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Set pre-release version
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "${MAJOR_MINOR}.$(date -u +'%y%j%H%M')" --no-git-tag-version

      - name: Publish Extension (OpenVSX, pre-release)
        run: |
          if output=$(npx ovsx publish --pre-release --pat ${{ secrets.OPENVSX_TOKEN }} 2>&1); then
            echo "$output"
          elif echo "$output" | grep -qi "already published"; then
            echo "$output"
            echo "::notice::Version is already published on OpenVSX, skipping."
          else
            echo "$output"
            exit 1
          fi
        timeout-minutes: 2
