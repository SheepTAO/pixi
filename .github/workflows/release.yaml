name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    name: 'Check version'
    runs-on: ubuntu-latest
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate package version matches git tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

  publish-code-marketplace:
    name: 'Publish (Code Marketplace)'
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Publish Extension (Code Marketplace)
        run: |
          MAX_RETRIES=5
          DELAY=20
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to publish to Code Marketplace..."
            if output=$(npx @vscode/vsce publish --skip-duplicate --pat "${{ secrets.MARKETPLACE_TOKEN }}" 2>&1); then
              echo "$output"
              exit 0
            else
              echo "$output"
              if echo "$output" | grep -qiE "RequestBlockedException|Concurrency|Rate limits|429"; then
                echo "::warning::Marketplace concurrency rate limit hit. Waiting ${DELAY}s before retrying (attempt $i/$MAX_RETRIES)..."
                sleep $DELAY
                DELAY=$((DELAY * 2))
              elif echo "$output" | grep -qi "already published"; then
                echo "::notice::Version already published on Code Marketplace, skipping."
                exit 0
              else
                echo "::error::Publish failed with non-retryable error."
                exit 1
              fi
            fi
          done
          echo "::error::Exceeded maximum retry attempts ($MAX_RETRIES) due to Marketplace concurrency limit."
          exit 1
        timeout-minutes: 5

  publish-openvsx:
    name: 'Publish (OpenVSX)'
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Publish Extension (OpenVSX, release)
        run: |
          if output=$(npx ovsx publish --pat ${{ secrets.OPENVSX_TOKEN }} 2>&1); then
            echo "$output"
          elif echo "$output" | grep -qi "already published"; then
            echo "$output"
            echo "::notice::Version is already published on OpenVSX, skipping."
          else
            echo "$output"
            exit 1
          fi
        timeout-minutes: 2

  github-release:
    name: 'Create GitHub Release'
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: write
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - run: npm ci

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} *.vsix --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
